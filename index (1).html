<style>
@font-face{
  font-family:"Vin Mono Pro";
  src:local("Vin Mono Pro Bold"),local("VinMonoPro-Bold"),url("fonts/VinMonoPro-Bold.woff2") format("woff2");
  font-weight:700;font-style:normal;font-display:swap;
}
:root{
  --bg:#E5E8EC; --surface:#FFFFFF; --surface-2:#EEF0F3; --ink:#181919; --muted:#5B6066; --line:#C9CDD3;
  --plate:#181919; --plate-ink:#E5E8EC; --plate-muted:#8E959C; --plate-2:#282828; --plate-line:#3A3B3C; --plate-flag:#F98C4A; --ghost:#282828;
  --primary:#181919; --primary-ink:#E5E8EC;
  --accent:#FFD23F; --accent-ink:#181919; --hl:#FFF1BF;
  --ok:#46D369; --bad:#F98C4A; --pill-ink:#181919; --err-text:#B4521C;
  --ava-o-bg:#181919; --ava-o-ink:#E5E8EC; --ava-i-bg:#E5E8EC; --ava-i-ink:#181919;
  --hdr-bg:#181919; --hdr-ink:#E5E8EC; --hdr-muted:#8E959C; --hdr-track:#282828;
  --overlay:rgba(24,25,25,.6); --focus:#181919;
  --head:"Vin Mono Pro","IBM Plex Mono",ui-monospace,"Cascadia Mono",Consolas,monospace;
  --sans:"IBM Plex Sans","Segoe UI",Roboto,"Helvetica Neue",Arial,sans-serif;
  --mono:"IBM Plex Mono",ui-monospace,"Cascadia Mono",Consolas,Menlo,monospace;
  --r:24px; --r-s:16px;
  box-sizing:border-box;
  padding-top:env(safe-area-inset-top,0px);
  padding-bottom:env(safe-area-inset-bottom,0px);
  color-scheme:light;
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    color-scheme:dark;
    --bg:#181919; --surface:#282828; --surface-2:#202121; --ink:#E5E8EC; --muted:#9AA0A6; --line:#3A3B3C;
    --plate:#E5E8EC; --plate-ink:#181919; --plate-muted:#5B6066; --plate-2:#FFFFFF; --plate-line:#C9CDD3; --plate-flag:#C4561C; --ghost:#D8DCE0;
    --primary:#E5E8EC; --primary-ink:#181919; --hl:#3D3714; --err-text:#FF9E66;
    --ava-o-bg:#E5E8EC; --ava-o-ink:#181919; --ava-i-bg:#3A3B3C; --ava-i-ink:#E5E8EC;
    --overlay:rgba(0,0,0,.7); --focus:#E5E8EC;
  }
}
:root[data-theme="dark"]{
  color-scheme:dark;
  --bg:#181919; --surface:#282828; --surface-2:#202121; --ink:#E5E8EC; --muted:#9AA0A6; --line:#3A3B3C;
  --plate:#E5E8EC; --plate-ink:#181919; --plate-muted:#5B6066; --plate-2:#FFFFFF; --plate-line:#C9CDD3; --plate-flag:#C4561C; --ghost:#D8DCE0;
  --primary:#E5E8EC; --primary-ink:#181919; --hl:#3D3714; --err-text:#FF9E66;
  --ava-o-bg:#E5E8EC; --ava-o-ink:#181919; --ava-i-bg:#3A3B3C; --ava-i-ink:#E5E8EC;
  --overlay:rgba(0,0,0,.7); --focus:#E5E8EC;
}
*,*::before,*::after{box-sizing:border-box}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
body{margin:0;background:var(--bg);color:var(--ink);font-family:var(--sans);font-weight:400;font-size:15px;line-height:1.5;-webkit-font-smoothing:antialiased}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);z-index:10;background:var(--hdr-bg)}
button{font:inherit;color:inherit}
:focus-visible{outline:3px solid var(--focus);outline-offset:2px}
h1,h2,h3{margin:0}
p{margin:0}
img{max-width:100%}

/* Заголовки за брендом: моно, капс, інтерліньяж = кеглю */
.h,.panel h2,.dialog h2{font-family:var(--head);font-weight:700;text-transform:uppercase;line-height:1;letter-spacing:.01em}
.display{font-family:var(--head);font-weight:700;text-transform:uppercase;line-height:1;letter-spacing:-.01em;font-size:clamp(48px,9vw,104px)}
.display.sm{font-size:clamp(36px,6vw,64px)}

/* Шапка */
.bar{position:sticky;top:env(safe-area-inset-top,0px);z-index:5;background:var(--hdr-bg);color:var(--hdr-ink);border-bottom:1px solid var(--hdr-track)}
.bar-in{max-width:1440px;margin:0 auto;padding:12px 24px;display:flex;align-items:center;gap:28px;flex-wrap:wrap}
.brand{display:flex;align-items:center;gap:14px;min-width:240px}
.logo{height:36px;width:auto;display:block}
.case-k{font-size:12px;color:var(--hdr-muted)}
.case-t{font-family:var(--head);font-weight:700;text-transform:uppercase;line-height:1;font-size:15px;margin-top:3px}
.time{flex:1;display:flex;align-items:center;gap:18px;min-width:280px}
.clock{font-family:var(--head);font-weight:700;font-size:30px;line-height:1;font-variant-numeric:tabular-nums;color:var(--accent)}
.tl{flex:1;min-width:160px}
.track{height:8px;border-radius:999px;background:var(--hdr-track);overflow:hidden}
.fill{height:100%;border-radius:999px;background:linear-gradient(90deg,#5B6066,var(--accent));transition:width .6s ease}
.ticks{display:flex;justify-content:space-between;font-family:var(--mono);font-size:11px;color:var(--hdr-muted);margin-top:5px}
.left{font-size:13px;color:var(--hdr-muted);white-space:nowrap;min-width:150px;text-align:right}
@media (max-width:640px){
  .bar-in{flex-direction:column;align-items:stretch;gap:8px;padding:10px 16px}
  .logo{height:30px}
  .time{flex-wrap:wrap;gap:4px 14px;min-width:0;width:100%}
  .clock{font-size:24px}
  .tl{min-width:0}
  .ticks span:not(:first-child):not(:last-child){display:none}
  .left{min-width:0;text-align:left;width:100%}
}

/* Плашки */
.plate{background:var(--plate);color:var(--plate-ink);border-radius:var(--r);padding:24px;position:relative;overflow:hidden}
.panel,.card{background:var(--surface);border-radius:var(--r);padding:20px}
.panel h2{font-size:15px;margin-bottom:14px}
.pills{display:flex;flex-wrap:wrap;gap:8px}
.pill{display:inline-flex;align-items:center;padding:5px 12px;border-radius:999px;background:var(--surface-2);color:var(--ink);font-size:13px;line-height:1.3;white-space:nowrap}
.plate .pill{background:var(--plate-2);color:var(--plate-ink)}
.pill.accent{background:var(--accent);color:var(--accent-ink)}
.pill.ok{background:var(--ok);color:var(--pill-ink)}
.pill.bad{background:var(--bad);color:var(--pill-ink)}
.pill.dark{background:var(--primary);color:var(--primary-ink)}

/* Кнопки — пігулки */
.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;padding:11px 20px;border-radius:999px;border:1.5px solid var(--ink);background:transparent;cursor:pointer;font-weight:500;width:100%;line-height:1.3;text-align:center}
.btn:hover:not(:disabled){background:var(--surface-2)}
.btn.primary{background:var(--primary);color:var(--primary-ink);border-color:var(--primary)}
.btn.primary:hover:not(:disabled){opacity:.88;background:var(--primary)}
.btn.accent{background:var(--accent);color:var(--accent-ink);border-color:var(--accent)}
.btn.accent:hover:not(:disabled){filter:brightness(1.05);background:var(--accent)}
.btn:disabled{opacity:.4;cursor:not-allowed}
.btn.inline{width:auto}
.link{background:none;border:0;padding:0;color:inherit;text-decoration:underline;text-underline-offset:3px;cursor:pointer;font-size:13px}
.pill-btn{display:inline-flex;align-items:center;padding:5px 12px;border-radius:999px;border:1px solid var(--plate-line);background:transparent;color:var(--plate-ink);cursor:pointer;font-size:13px;margin-top:10px}
.pill-btn:hover{background:var(--plate-2)}
.mono{font-family:var(--mono);font-variant-numeric:tabular-nums}
.num{text-align:right;font-family:var(--mono);font-variant-numeric:tabular-nums;white-space:nowrap}

/* Вступ */
.intro{max-width:960px;margin:0 auto;padding:28px 24px 64px;display:flex;flex-direction:column;gap:20px}
.hero{display:grid;grid-template-columns:minmax(0,1fr) auto;gap:24px;align-items:center;padding:32px}
.hero .pills{margin-bottom:28px}
.hero-sub{font-family:var(--head);font-weight:700;font-size:20px;line-height:1;margin-top:18px}
.hero-lead{color:var(--plate-muted);max-width:52ch;margin:14px 0 26px;font-size:16px}
.hero.plate .hero-lead{color:var(--plate-ink);opacity:.8}
.obj3d{width:clamp(140px,26vw,260px);height:auto;pointer-events:none;user-select:none}
.ghost{position:absolute;right:-6px;top:-14px;font-family:var(--head);font-weight:700;line-height:1;font-size:clamp(90px,15vw,190px);color:var(--ghost);pointer-events:none;user-select:none}
.hero > *:not(.ghost){position:relative}
@media (max-width:640px){
  .hero{grid-template-columns:1fr;padding:24px}
  .hero .obj3d{order:-1;width:120px;justify-self:end;margin-bottom:-16px}
}
.block{background:var(--surface);border-radius:var(--r);padding:28px}
.block > .h{font-size:22px;margin-bottom:20px}
.cast{display:grid;grid-template-columns:repeat(3,1fr);gap:12px}
@media (max-width:820px){.cast{grid-template-columns:1fr}}
.person{background:var(--surface-2);border-radius:var(--r-s);padding:18px;display:flex;flex-direction:column;gap:10px}
.person .p-name{font-family:var(--head);font-weight:700;text-transform:uppercase;line-height:1;font-size:18px}
.person p{font-size:14px}
.ava{width:44px;height:44px;border-radius:12px;display:grid;place-items:center;flex:none;font-family:var(--head);font-weight:700;font-size:16px;line-height:1}
.ava.me{background:var(--accent);color:var(--accent-ink)}
.ava.o{background:var(--ava-o-bg);color:var(--ava-o-ink)}
.ava.i{background:var(--ava-i-bg);color:var(--ava-i-ink);box-shadow:inset 0 0 0 1px var(--line)}
.chat{display:flex;flex-direction:column;gap:12px}
.msg{display:grid;grid-template-columns:44px 1fr;gap:12px;align-items:start}
.bubble{background:var(--surface-2);border-radius:6px var(--r-s) var(--r-s) var(--r-s);padding:12px 16px}
.who{font-size:13px;color:var(--muted);margin-bottom:4px}
.who b{color:var(--ink);font-weight:600}
.steps{list-style:none;margin:0;padding:0;counter-reset:st;display:flex;flex-direction:column;gap:14px}
.steps li{counter-increment:st;display:grid;grid-template-columns:56px 1fr;gap:14px;align-items:start}
.steps li::before{content:counter(st,decimal-leading-zero);font-family:var(--head);font-weight:700;font-size:28px;line-height:1;color:var(--ink);padding-top:2px}
.steps b{font-weight:600}
.after-steps{background:var(--surface-2);border-radius:var(--r-s);padding:14px 18px;margin-top:18px}
.muted-p{color:var(--muted);font-size:14px;margin-top:14px}
.start-row{display:flex;justify-content:center;padding-top:8px}

/* Робочий екран */
.work{max-width:1440px;margin:0 auto;padding:24px;display:grid;grid-template-columns:280px minmax(0,1fr) 330px;gap:20px;align-items:start}
.col-l,.col-r,.col-c{display:flex;flex-direction:column;gap:20px;min-width:0}
@media (max-width:1150px){.work{grid-template-columns:1fr}.col-l{order:-2}.col-c{order:-1}}
.kpi .h{font-size:15px}
.plate-sub{font-size:13px;color:var(--plate-muted);margin:6px 0 16px}
.metric{padding:12px 0;border-top:1px solid var(--plate-line)}
.m-l{font-size:13px;color:var(--plate-muted)}
.m-v{font-family:var(--head);font-weight:700;font-size:26px;line-height:1.1;font-variant-numeric:tabular-nums;margin-top:4px}
.metric.is-flag .m-v{color:var(--plate-flag)}
.budget{font-size:13px;color:var(--plate-muted);border-top:1px dashed var(--plate-line);padding-top:12px}
.note{font-size:13px;background:var(--plate-2);border-radius:12px;padding:10px 12px;margin-top:12px}
.act{display:flex;flex-direction:column;gap:8px}
.hint-s{font-size:12px;color:var(--muted);margin:-2px 0 6px;text-align:center}

.tools{list-style:none;margin:0;padding:0;display:flex;flex-direction:column;gap:8px}
.tool{width:100%;text-align:left;display:grid;grid-template-columns:1fr auto;gap:2px 10px;padding:12px 14px;border-radius:var(--r-s);border:0;background:var(--surface-2);cursor:pointer}
.tool:hover:not(:disabled){box-shadow:inset 0 0 0 1.5px var(--ink)}
.tool:disabled{opacity:.4;cursor:not-allowed}
.t-n{font-weight:500}
.t-c{grid-row:1/3;grid-column:2;align-self:center;font-size:12px;padding:3px 10px;border-radius:999px;white-space:nowrap;background:var(--accent);color:var(--accent-ink)}
.t-c.done{background:var(--primary);color:var(--primary-ink)}
.t-d{font-size:12px;color:var(--muted)}

.journal-empty{font-size:13px;color:var(--muted)}
.count{display:inline-grid;place-items:center;min-width:24px;height:24px;padding:0 7px;border-radius:999px;background:var(--accent);color:var(--accent-ink);font-family:var(--mono);font-size:12px;margin-left:6px;vertical-align:middle;text-transform:none}
.finding{background:var(--surface-2);border-radius:var(--r-s);padding:14px;margin-top:10px}
.finding:first-of-type{margin-top:0}
.f-t{font-weight:600;font-size:14px}
.f-d{font-size:13px;color:var(--muted);margin:4px 0 10px}
.f-n{font-size:12px;margin:-4px 0 10px;padding:6px 10px;border-radius:10px;background:var(--surface);color:var(--ink)}
.verdicts{display:flex;flex-direction:column;gap:6px}
.vb{text-align:left;font-size:13px;padding:7px 12px;border-radius:999px;border:1px solid var(--line);background:var(--surface);cursor:pointer}
.vb:hover{border-color:var(--ink)}
.vb[aria-pressed="true"]{background:var(--primary);color:var(--primary-ink);border-color:var(--primary)}

.m-head{display:flex;gap:12px;align-items:center;margin-bottom:14px}
.m-head .ava{width:40px;height:40px}
.m-name{font-family:var(--head);font-weight:700;text-transform:uppercase;line-height:1;font-size:15px}
.m-role{font-size:12px;color:var(--muted);margin-top:3px}
.m-log{display:flex;flex-direction:column;gap:8px;max-height:280px;overflow:auto;margin-bottom:12px}
.m-msg{background:var(--surface-2);border-radius:6px 14px 14px 14px;padding:9px 12px;font-size:13px;line-height:1.45}
.m-msg:last-child{background:var(--hl)}
.warn{background:var(--bad);color:var(--pill-ink);border-radius:var(--r-s);padding:12px 14px;font-size:13px;line-height:1.45}
.warn b{font-weight:600;display:block;margin-bottom:2px}
.m-time{display:block;font-family:var(--mono);font-size:11px;color:var(--muted);margin-bottom:2px}

/* Результат перевірки */
.result-h{display:flex;justify-content:space-between;align-items:baseline;gap:12px;margin-bottom:14px}
.result-h .h{font-size:15px;margin:0}
.result p+p,.result p+table,.result table+p{margin-top:12px}
.mini{border-collapse:collapse;font-size:13px;width:100%}
.mini th,.mini td{padding:7px 10px;border-bottom:1px solid var(--line);text-align:left}
.mini th{color:var(--muted);font-weight:500}
.row-btns{display:flex;flex-wrap:wrap;gap:8px;margin:6px 0 8px}
.chip{font-family:var(--mono);font-size:13px;padding:6px 14px;border-radius:999px;border:1px solid var(--line);background:var(--surface-2);cursor:pointer}
.chip:hover:not(:disabled){border-color:var(--ink)}
.chip:disabled{opacity:.4;cursor:not-allowed}
.chip[aria-pressed="true"]{background:var(--primary);color:var(--primary-ink);border-color:var(--primary)}
.chip[aria-pressed="true"] small{color:inherit;opacity:.75}
.chip small{font-family:var(--sans);color:var(--muted)}
.mini-btn{font-size:12px;padding:3px 10px;border-radius:999px;border:1px solid var(--line);background:var(--surface);cursor:pointer;white-space:nowrap}
.mini-btn:hover{border-color:var(--ink)}
.chars{display:flex;flex-wrap:wrap;gap:6px;margin:10px 0}
.ch{border-radius:12px;padding:8px 10px;min-width:68px;text-align:center;background:var(--surface-2)}
.ch b{display:block;font-family:var(--mono);font-size:22px}
.ch span{display:block;font-family:var(--mono);font-size:11px;color:var(--muted)}
.ch em{display:block;font-style:normal;font-size:11px;color:var(--muted)}
.ch.bad{background:var(--bad);color:var(--pill-ink)}
.ch.bad span,.ch.bad em{color:var(--pill-ink)}
.gran{display:grid;grid-template-columns:auto 1fr;gap:8px 12px;align-items:center;margin:8px 0 14px}
.gran select{font:inherit;padding:7px 12px;border-radius:999px;border:1px solid var(--line);background:var(--surface);color:var(--ink);min-width:0;width:100%}
.good{color:inherit} .good::before{content:"";display:inline-block;width:8px;height:8px;border-radius:50%;background:var(--ok);margin-right:6px}
.bad-t{color:var(--err-text)}
.err{font-size:13px;color:var(--err-text);margin-top:8px}

/* Таблиці */
.tabs{display:flex;gap:6px;flex-wrap:wrap;margin-bottom:10px}
.tab{padding:7px 14px;border-radius:999px;border:1px solid var(--line);background:transparent;cursor:pointer;font-size:13px;color:var(--ink)}
.tab:hover{border-color:var(--ink)}
.tab[aria-selected="true"]{background:var(--primary);color:var(--primary-ink);border-color:var(--primary)}
.tab .mono{font-size:12px;opacity:.7}
.sheet{background:var(--surface);border-radius:var(--r);overflow:hidden}
.file{display:flex;justify-content:space-between;gap:12px;flex-wrap:wrap;padding:14px 18px;border-bottom:1px solid var(--line);font-size:13px;color:var(--muted)}
.file b{font-family:var(--mono);font-weight:500;color:var(--ink)}
.scroll{overflow:auto;max-height:520px}
table.grid{border-collapse:collapse;width:100%;font-size:13px}
.grid th{position:sticky;top:0;background:var(--surface-2);text-align:left;font-weight:500;color:var(--muted);padding:9px 14px;border-bottom:1px solid var(--line);white-space:nowrap}
.grid td{padding:8px 14px;border-bottom:1px solid var(--line);white-space:nowrap}
.grid td.k{font-family:var(--mono)}
.grid tr.click{cursor:pointer}
.grid tr.click:hover td,.grid tr.click:focus-visible td{background:var(--surface-2)}
.grid tr.click:focus-visible{outline:none}
.grid tr.hl td{background:var(--hl)}
.grid tfoot td{font-weight:600;background:var(--surface-2);border-bottom:0;position:sticky;bottom:0}

/* Модальні вікна */
.overlay{position:fixed;inset:0;background:var(--overlay);display:grid;place-items:center;padding:20px;z-index:20}
.dialog{background:var(--surface);border-radius:var(--r);max-width:580px;width:100%;max-height:calc(100% - 40px);overflow:auto;padding:28px}
.dialog.wide{max-width:720px}
.dialog:focus{outline:none}
.dialog h2{font-size:22px;margin-bottom:12px}
.dialog > p{margin-bottom:12px}
.opts{display:flex;flex-direction:column;gap:8px;margin:14px 0 10px}
.opt{display:grid;grid-template-columns:20px 1fr;gap:10px;align-items:start;background:var(--surface-2);border-radius:var(--r-s);padding:12px 14px;cursor:pointer;border:1.5px solid transparent}
.opt:has(input:checked){border-color:var(--ink)}
.opt input{margin-top:4px;accent-color:var(--ink)}
.opt.dis{opacity:.5;cursor:not-allowed}
.d-acts{display:flex;gap:10px;justify-content:flex-end;flex-wrap:wrap;margin-top:18px}
.paper{background:var(--surface-2);border-radius:var(--r-s);padding:24px;font-size:14px}
.paper-h{font-family:var(--head);font-weight:700;text-transform:uppercase;line-height:1;font-size:16px;margin-bottom:18px}
.paper dl{display:grid;grid-template-columns:auto 1fr;gap:8px 18px;margin:0}
.paper dt{color:var(--muted)}
.paper dd{margin:0}
.paper-f{margin-top:18px;padding-top:12px;border-top:1px dashed var(--line);font-size:12px;color:var(--muted)}

/* Брифінг */
.brief{max-width:860px;margin:0 auto;padding:28px 24px 64px;display:flex;flex-direction:column;gap:20px}
.stats{display:grid;grid-template-columns:repeat(3,1fr);gap:12px}
@media (max-width:640px){.stats{grid-template-columns:1fr}}
.stat{background:var(--surface);border-radius:var(--r-s);padding:16px 18px}
.stat span{font-size:13px;color:var(--muted)}
.stat b{display:block;font-family:var(--head);font-weight:700;font-size:24px;line-height:1.1;margin-top:6px;font-variant-numeric:tabular-nums}
.slot{border:0;padding:24px;margin:0;background:var(--surface);border-radius:var(--r)}
.slot legend{float:left;width:100%;font-family:var(--head);font-weight:700;text-transform:uppercase;line-height:1;font-size:17px;margin-bottom:14px;padding:0}
.slot legend span{color:var(--muted);margin-right:10px}
.card-opt{display:block;width:100%;text-align:left;padding:14px 16px;margin-top:8px;border-radius:var(--r-s);border:1.5px solid transparent;background:var(--surface-2);cursor:pointer;line-height:1.45}
.card-opt:hover{border-color:var(--ink)}
.card-opt[aria-pressed="true"]{background:var(--primary);color:var(--primary-ink);border-color:var(--primary)}

/* Фінал */
.end{max-width:900px;margin:0 auto;padding:28px 24px 64px;display:flex;flex-direction:column;gap:20px}
.end .hero .pill{margin-bottom:22px}
.story{font-size:17px;max-width:58ch;margin-top:18px}
.hero.plate .story{color:var(--plate-ink);opacity:.85}
.scores{display:grid;grid-template-columns:repeat(3,1fr);gap:12px}
@media (max-width:640px){.scores{grid-template-columns:1fr}}
.score{background:var(--surface);border-radius:var(--r-s);padding:18px}
.score b{display:block;font-family:var(--head);font-weight:700;font-size:34px;line-height:1;margin-bottom:8px;font-variant-numeric:tabular-nums}
.score span{font-size:13px;color:var(--muted)}
.rev-list{display:flex;flex-direction:column;gap:10px}
.rev{background:var(--surface-2);border-radius:var(--r-s);padding:16px 18px}
.rev-top{display:flex;flex-wrap:wrap;gap:6px;margin-bottom:10px}
.rev-t{font-weight:600}
.rev-m{font-size:13px;margin:4px 0 6px}
.rev-w{font-size:14px;color:var(--muted)}
.foot{max-width:1440px;margin:0 auto;padding:0 24px 28px;font-size:12px;color:var(--muted)}

@media (prefers-reduced-motion: reduce){*{transition:none!important;animation:none!important}}

.result-h h2{margin:0}
.rev .pill:not(.ok):not(.bad){background:var(--surface)}
.p-top{display:flex;align-items:center;gap:12px}
.sub-h{font-family:var(--head);font-weight:700;text-transform:uppercase;line-height:1;font-size:16px;margin:0 0 16px;color:var(--muted)}
.sub-h.second{margin-top:36px;padding-top:28px;border-top:1px solid var(--line)}
.mech{display:grid;grid-template-columns:repeat(2,1fr);gap:10px}
.mech-c{background:var(--surface-2);border-radius:var(--r-s);padding:18px 20px}
.mech-c.wide{grid-column:1/-1}
.mech-c h4{font-family:var(--head);font-weight:700;text-transform:uppercase;line-height:1;font-size:15px;margin:0 0 10px}
.mech-c p{font-size:14px}
.mech-c p+p,.mech-c .pills+p,.mech-c p+.pills{margin-top:10px}
@media (max-width:700px){.mech{grid-template-columns:1fr}}
.mech-wrap{margin-top:28px;padding-top:24px;border-top:1px solid var(--line)}
.mech-wrap summary{list-style:none;display:flex;align-items:center;justify-content:space-between;gap:16px;cursor:pointer;background:var(--surface-2);border-radius:var(--r-s);padding:16px 20px}
.mech-wrap summary::-webkit-details-marker{display:none}
.mech-wrap summary:hover{box-shadow:inset 0 0 0 1.5px var(--ink)}
.mech-wrap[open] summary{margin-bottom:12px}
.sum-text{display:flex;flex-direction:column;gap:6px}
.sum-text .sub-h{margin:0;color:var(--ink)}
.sum-hint{font-size:13px;color:var(--muted)}
.sum-btn{display:inline-flex;align-items:center;gap:8px;flex:none;padding:7px 14px;border-radius:999px;background:var(--primary);color:var(--primary-ink);font-size:13px}
.chev{width:8px;height:8px;border-right:2px solid currentColor;border-bottom:2px solid currentColor;transform:rotate(45deg) translateY(-2px);transition:transform .2s ease}
.mech-wrap[open] .chev{transform:rotate(-135deg) translateY(-2px)}
.when-open{display:none}
.mech-wrap[open] .when-open{display:inline}
.mech-wrap[open] .when-closed{display:none}
@media (max-width:560px){.mech-wrap summary{flex-direction:column;align-items:flex-start}}
.path{display:flex;flex-wrap:wrap;align-items:center;gap:6px;margin:4px 0 10px}
.path i{font-style:normal;color:var(--muted);font-size:13px}
.mech-c .pill:not(.accent){background:var(--surface);box-shadow:inset 0 0 0 1px var(--line)}
.wf{display:grid;grid-template-columns:1fr 1.6fr 1fr;gap:8px;margin:12px 0}
.wf-top{grid-column:1/-1;background:var(--hdr-bg);color:var(--hdr-ink);border-radius:10px;padding:8px 12px;font-size:12px}
.wf-col{display:flex;flex-direction:column;gap:6px}
.wf-t{font-size:12px;color:var(--muted)}
.wf-b{background:var(--surface);border-radius:10px;padding:8px 10px;font-size:12px;line-height:1.45;box-shadow:inset 0 0 0 1px var(--line)}
.wf-b.dark{background:var(--plate);color:var(--plate-ink);box-shadow:none}
.wf-b.tall{min-height:72px}
@media (max-width:560px){.wf{grid-template-columns:1fr}}

const trancheCount = {};
const PAYMENTS = RAW.map(([id,date,key,amt,doc]) => {
  const c = CONTRACTS.find(x => x.key === norm(key));
  const nk = norm(key);
  trancheCount[nk] = (trancheCount[nk] || 0) + 1;
  const purpose = c

  return {id, date, key, amt, doc, sup: c ? c.sup : "ТОВ «Тета Трейд»", purpose};
});
const MERGED = (() => {
  const rows = [];
  CONTRACTS.forEach(c => {
    const m = PAYMENTS.filter(p => p.key === c.key);
    if (!m.length) rows.push({c, p:null, first:true});
    else m.forEach((p,i) => rows.push({c, p, first:i === 0}));
  });
  return rows;
})();

};

  if (!S.fix) return {commit:T.commitMerged, paid:T.paidMerged, note:null};

      } else if (S.antiShow === "con"){
        body += `<p>Таких немає: кожен контракт має хоча б одну оплату з точно таким самим ключем.</p>`;
      }
      break;
    case "dup":
      title = "Пошук дублів";
      body = `<p>Знайдено 1 групу з однаковими ключем і сумою.</p>

        ${PAYMENTS.filter(p => p.id === "П-0301" || p.id === "П-0306").map(p => `<tr><td class="mono">${p.id}</td><td class="mono">${p.key}</td><td>${p.date}</td><td class="mono">${p.doc}</td><td class="num">${uah(p.amt)}</td></tr>`).join("")}</tbody></table>`;
      break;
    case "lens": {
      title = "Лупа символів";
      body = `<p>Обери ключ із реєстру оплат. Кожен новий розбір забирає 30 хв.</p><div class="row-btns">
        ${LENS_KEYS.map((k,i) => `<button class="chip" data-act="lens" data-i="${i}" aria-pressed="${S.lensSel === k}" ${S.lens[k] || canSpend(30) ? "" : "disabled"}>${k} <small>${PAYMENTS.filter(p => p.key === k).length} опл.</small></button>`).join("")}</div>`;
      if (S.lensSel){
        const k = S.lensSel;
        const chars = [...k].map(ch => {
          const cp = ch.codePointAt(0);
          const name = ch === "C" ? "латинська C" : ch === "\u0421" ? "кирилична Ес" : ch === "-" ? "дефіс" : "цифра";
          return `<div class="ch ${cp === 0x421 ? "bad" : ""}"><b>${ch}</b><span>U+${cp.toString(16).toUpperCase().padStart(4,"0")}</span><em>${name}</em></div>`;
        }).join("");
        body += `<div class="chars">${chars}</div>` + (k === CYR
          ? `<p>Перша літера кирилична «Ес» (U+0421), а не латинська C (U+0043). На екрані їх не відрізнити, але для Merge це два різні ключі.</p>`
          : k === C(1149)
            ? `<p>Усі символи коректні. Ключ записаний правильно, але контракту C-1149 у реєстрі немає.</p>`
            : `<p>Усі символи коректні: латинська C, дефіс і цифри.</p>`);
      }
      break; }
    case "fixed": {
      title = "Модель виправлено";
      const k = kpi();
      body = `<p>Зобов’язання тепер ${mln(k.commit)}, оплачено ${mln(k.paid)}.</p><p>${k.note}</p>`;
      break; }
  }
  return `<div class="panel result" aria-live="polite"><div class="result-h"><h2>${title}</h2><button class="link" data-act="hide">Сховати</button></div>${body}</div>`;
}

    body = PAYMENTS.map(p => `<tr class="click ${S.hl.has(p.id) ? "hl" : ""}" tabindex="0" data-act="doc" data-id="${p.id}">
      <td class="k">${p.id}</td><td>${p.date}</td><td class="k">${p.key}</td><td>${p.sup}</td><td class="num">${uah(p.amt)}</td><td class="k">${p.doc}</td></tr>`).join("");
    foot = `<tr><td colspan="4">Разом</td><td class="num">${uah(T.paidAll)}</td><td></td></tr>`;
  }
  return `<div>
    <div class="tabs" role="tablist">${tabs.map(([id,n,c]) => `<button class="tab" role="tab" aria-selected="${S.tab === id}" data-act="tab" data-v="${id}">${n} <span class="mono">${c}</span></button>`).join("")}</div>
    <div class="sheet"><div class="file">${file}</div>
      <div class="scroll"><table class="grid"><thead><tr>${head}</tr></thead><tbody>${body}</tbody><tfoot>${foot}</tfoot></table></div>
    </div></div>`;
}

function work(){
  return `<main class="work">
    <section class="col-l">${kpiCard(kpi())}${actions()}${mentorCard()}</section>
    <section class="col-c">${S.result ? resultCard() : ""}${tables()}</section>
    <aside class="col-r">${toolsCard()}${journalCard()}</aside>
  </main>
  <p class="foot">robot_dreams. Прототип однієї справи до курсу «Аналітика в оборонній сфері». Усі дані синтетичні.</p>`;
}

function modal(){
  if (!S.modal) return "";
  let inner = "";
  if (S.modal === "doc"){
    const p = PAYMENTS.find(x => x.id === S.doc);
    inner = `<div class="paper">
      <div class="paper-h">Платіжне доручення № ${p.doc.replace("ПД-","")}</div>
      <dl><dt>Дата</dt><dd>${p.date}</dd><dt>Платник</dt><dd>ТОВ «Ковальня-17»</dd><dt>Отримувач</dt><dd>${p.sup}</dd>
      <dt>Сума</dt><dd class="mono">${uah(p.amt)}</dd><dt>Призначення</dt><dd>${p.purpose}</dd></dl>
      <div class="paper-f">У реєстрі оплат: ${p.id}. Документ синтетичний.</div></div>
      <div class="d-acts"><button class="btn inline" data-act="close">Закрити</button></div>`;
  } else if (S.modal === "fix"){
    inner = `<h2>Виправити модель</h2><p>Як прибрати роздуту суму? Виправлення забере 1 годину.</p>
      <div class="opts">${FIXES.map(f => `<label class="opt"><input type="radio" name="fix" value="${f.id}" ${S.fix === f.id ? "checked" : ""}><span>${f.t}</span></label>`).join("")}</div>
      <label class="opt ${S.found.F2 ? "" : "dis"}"><input type="checkbox" id="norm" ${S.found.F2 ? "" : "disabled"} ${S.norm ? "checked" : ""}>
        <span>Замінити кириличну С на латинську C у ключах перед зіставленням${S.found.F2 ? "" : " (спершу з’ясуй, чому частина оплат не зіставилась)"}</span></label>
      ${S.fixErr === "none" ? `<p class="err">Обери спосіб виправлення.</p>` : S.fixErr === "time" ? `<p class="err">Не вистачає часу до брифінгу.</p>` : ""}
      <div class="d-acts"><button class="btn inline" data-act="close">Скасувати</button><button class="btn primary inline" data-act="applyFix">Застосувати</button></div>`;
  } else if (S.modal === "rules"){
    inner = `<h2>Як грати</h2>${rulesHTML()}<div class="d-acts"><button class="btn primary inline" data-act="close">Повернутися до справи</button></div>`;
  } else if (S.modal === "timeout"){
    inner = `<h2>08:00</h2><p>Час вийшов. Ольга вже в переговорній, тож іди з тим, що маєш.</p>
      <div class="d-acts"><button class="btn primary inline" data-act="brief">На брифінг</button></div>`;
  }
  return `<div class="overlay" ${S.modal === "timeout" ? "" : `data-act="overlay"`}><div class="dialog ${S.modal === "rules" ? "wide" : ""}" role="dialog" aria-modal="true" tabindex="-1">${inner}</div></div>`;
}

function brief(){
  const k = kpi();
  const full = MEMO.every((_,i) => S.memo[i] !== undefined);
  return `<main class="brief">
    <section class="plate hero">
      <span class="ghost" aria-hidden="true">08:00</span>
      <div>
        <h1 class="display sm">Записка<br>для Ольги</h1>
        <p class="story">Ольга: «Я в переговорній. Одна сторінка: факт, причина, ризик, пропозиція, обмеження. По одному реченню.»</p>
      </div>
      <img class="obj3d" src="${IMG.bell}" alt="" aria-hidden="true">
    </section>
    <div class="stats">
      <div class="stat"><span>Зобов’язання на дашборді</span><b>${mln(k.commit)}</b></div>
      <div class="stat"><span>Оплачено</span><b>${mln(k.paid)}</b></div>
      <div class="stat"><span>Знахідок у журналі</span><b>${F_ORDER.filter(f => S.found[f]).length}</b></div>
    </div>
    ${MEMO.map((m,i) => `<fieldset class="slot"><legend><span>${pad(i + 1)}</span>${m.slot}</legend>${S.memoOrder[i].map(ci =>
      `<button class="card-opt" data-act="memo" data-s="${i}" data-i="${ci}" aria-pressed="${S.memo[i] === ci}">${m.cards[ci].t}</button>`).join("")}</fieldset>`).join("")}
    <div class="start-row"><button class="btn primary inline" data-act="submit" ${full ? "" : "disabled"}>Надіслати записку</button></div>
  </main>`;
}

function evaluate(){
  const fr = F_ORDER.map(f => ({f, found:!!S.found[f], v:S.verdict[f] || null, ok:!!S.found[f] && S.verdict[f] === FINDINGS[f].correct}));
  const mr = MEMO.map((m,i) => ({slot:m.slot, card:m.cards[S.memo[i]]}));
  let end;
  if (!S.fix) end = "asis";
  else if (S.fix !== "model") end = "dash";
  else if (S.verdict.F3 !== "exception" || !mr[2].card.ok) end = "missed";
  else if (["F1","F2","F4"].some(f => S.verdict[f] === "exception") || !mr[0].card.ok || !mr[1].card.ok || !mr[3].card.ok) end = "alarm";
  else end = "win";
  return {fr, mr, end};
}

const ENDINGS = {
  win:   {t:"Рішення на правильних цифрах", s:"Ольга пояснила раді різницю за дві хвилини: роздуте зведення, 49,0 млн реальних зобов’язань і один платіж, який треба перевірити сьогодні. Наступного кварталу модель оновиться сама, без ручних правок."},
  asis:  {t:"Звіт пішов як є", s:"Рада директорів побачила 149,25 млн зобов’язань і заморозила нові закупівлі. Модель так ніхто й не виправив, тож наступного кварталу цифра знову буде роздута."},
  missed:{t:"Платіж без підстави", s:"Цифри в звіті правильні, але 1,45 млн ₴ на користь ТОВ «Тета Трейд» без договору пройшли непоміченими. Їх знайде аудит, уже без вас."},
  alarm: {t:"Хибна тривога", s:"Цифри виправлені, але записка звучить тривожніше, ніж показують дані. Рада витратила засідання на проблему, якої немає, а справжній виняток загубився серед зайвого шуму."},
  dash:  {t:"Красивий дашборд", s:""},
};
const DASH_TEXT = {
  dedupe:"Цифра зобов’язань зійшлася, але видалення «дублів» викинуло 15 платежів: оплачено показує 15,32 млн замість 41,75. Рада побачила борг постачальникам, якого немає.",
  div3:"Поділ на 3 дав 49,75 млн. Майже правильно, і саме тому небезпечно: наступного кварталу траншів буде інша кількість, і формула мовчки збреше.",
  manual:"Ручне коригування зробило цифру правильною рівно до наступного оновлення файла. Хто й навіщо віднімав 100 млн, за місяць не пам’ятатиме ніхто.",
};
const FIX_WHY = {
  model:"Правильно: зобов’язання рахуються в реєстрі контрактів, оплати в реєстрі оплат, а таблиці зв’язані один-до-багатьох за ключем.",
  dedupe:"Видалення «дублів» лікує симптом і знищує дані: разом із повторами сум зникли справжні платежі.",
  div3:"Ділення на 3 підганяє відповідь під очікування. Кількість траншів у кожного контракту різна, тож це збіг, а не модель.",
  manual:"Ручне коригування не пояснює причину й ламається на першому ж оновленні.",
};

function end(){
  const e = evaluate();
  const E = ENDINGS[e.end];
  const story = e.end === "dash" ? DASH_TEXT[S.fix] : E.s;
  const fOk = e.fr.filter(x => x.ok).length;
  const mOk = e.mr.filter(x => x.card.ok).length;
  const win = e.end === "win";
  const lessonPill = s => `<span class="pill">${s.split(":")[0]}</span>`;
  return `<main class="end">
    <section class="plate hero">
      <div>
        <span class="pill ${win ? "ok" : "bad"}">${win ? "Справу закрито" : "Справу закрито з наслідками"}</span>
        <h1 class="display sm">${E.t}</h1>
        <p class="story">${story}</p>
      </div>
      <img class="obj3d" src="${win ? IMG.puzzle : IMG.cross}" alt="" aria-hidden="true">
    </section>

    <div class="scores">
      <div class="score"><b>${fOk} з 4</b><span>знахідок правильно оцінено</span></div>
      <div class="score"><b>${mOk} з 5</b><span>речень записки без пасток</span></div>
      <div class="score"><b>${left(S.used)}</b><span>використано з 6 годин</span></div>
    </div>

    <section class="block">
      <h2 class="h">Журнал відхилень</h2>
      <div class="rev-list">${e.fr.map(x => { const F = FINDINGS[x.f]; return `<div class="rev">
        <div class="rev-top"><span class="pill ${x.ok ? "ok" : "bad"}">${x.ok ? "Правильно" : !x.found ? "Пропущено" : "Помилка"}</span>${lessonPill(F.lesson)}</div>
        <div class="rev-t">${F.title}</div>
        <div class="rev-m">${!x.found ? "Цю знахідку пропущено." : x.v ? "Твій вердикт: " + VERDICTS[x.v].toLowerCase() + "." : "Вердикт не винесено."} Правильно: ${VERDICTS[F.correct].toLowerCase()}.</div>
        <div class="rev-w">${F.why}</div></div>`; }).join("")}</div>
    </section>

    <section class="block">
      <h2 class="h">Виправлення моделі</h2>
      <div class="rev">
        <div class="rev-top"><span class="pill ${S.fix === "model" ? "ok" : "bad"}">${S.fix === "model" ? (S.norm ? "Правильно" : "Майже") : "Помилка"}</span><span class="pill">Заняття 8</span></div>
        <div class="rev-t">${S.fix ? FIXES.find(f => f.id === S.fix).t : "Модель не виправлено"}</div>
        <div class="rev-w">${S.fix ? FIX_WHY[S.fix] : "Без виправлення рада бачить роздуту цифру."}${S.fix === "model" && !S.norm ? " Але ключі не нормалізовано: 4 110 000 ₴ оплат за С-1147 лишилися поза моделлю." : ""}</div>
      </div>
    </section>

    <section class="block">
      <h2 class="h">Записка</h2>
      <div class="rev-list">${e.mr.map(x => `<div class="rev">
        <div class="rev-top"><span class="pill ${x.card.ok ? "ok" : "bad"}">${x.card.ok ? "Правильно" : "Пастка"}</span><span class="pill">${x.slot}</span></div>
        <div class="rev-m" style="font-size:14px">${x.card.t}</div>${x.card.ok ? "" : `<div class="rev-w">${x.card.why}</div>`}</div>`).join("")}</div>
      <p class="muted-p">Структура записки — тема заняття 14.</p>
    </section>

    <div class="start-row"><button class="btn primary inline" data-act="restart">Зіграти ще раз</button></div>
  </main>`;
}

function render(){
  const app = document.getElementById("app");
  const scroller = app.querySelector(".scroll");
  const keep = scroller ? scroller.scrollTop : 0;
  const screens = {intro, work, brief, end};
  app.innerHTML = header() + screens[S.screen]() + modal();
  const s2 = app.querySelector(".scroll");
  if (s2) s2.scrollTop = keep;
  const log = app.querySelector(".m-log");
  if (log) log.scrollTop = log.scrollHeight;
  const d = app.querySelector(".dialog");
  if (d) d.focus();
}

/* ===================== ДІЇ ===================== */
function act(a, d){
  switch (a){
    case "start": S.screen = "work"; window.scrollTo(0,0); break;
    case "tab": S.tab = d.v; break;
    case "drill": S.tab = "merged"; S.result = {tool:"drill"}; S.hl = new Set(); break;
    case "hide": S.result = null; break;
    case "tool": {
      const t = TOOLS.find(x => x.id === d.v);
      if (!t.open && !S.ran[t.id]){
        if (!canSpend(t.cost)) return;
        spend(t.cost); S.ran[t.id] = true;
        if (t.id === "rows" || t.id === "sum") find("F1");
        if (t.id === "dup") find("F4");
      }
      if (t.id === "dup"){ S.hl = new Set(["П-0301","П-0306"]); S.tab = "payments"; }
      if (t.id === "rows" || t.id === "sum") S.hl = new Set();
      S.result = {tool:t.id};
      break; }
    case "granCheck": {
      const v = [0,1,2].map(i => document.getElementById("g" + i).value);
      if (v.some(x => x === "")){ S.granErr = true; break; }
      if (!canSpend(30)) return;
      spend(30); S.gran = v; S.granErr = false; S.ran.gran = true;
      if (v[2] === "2" || v[1] === "1") find("F1");
      break; }
    case "anti":
      if (!S.antiRun[d.v]){
        if (!canSpend(30)) return;
        spend(30); S.antiRun[d.v] = true;
        if (d.v === "pay"){ find("F2"); find("F3"); }
        if (S.antiRun.pay && S.antiRun.con) S.ran.anti = true;
      }
      S.antiShow = d.v;
      if (d.v === "pay"){ S.hl = new Set(["П-0313","П-0316","П-0322"]); S.tab = "payments"; }
      break;
    case "lens": {
      const k = LENS_KEYS[+d.i];
      if (!S.lens[k]){
        if (!canSpend(30)) return;
        spend(30); S.lens[k] = true;
        if (k === CYR) find("F2");
      }
      S.lensSel = k; S.result = {tool:"lens"};
      S.hl = new Set(PAYMENTS.filter(p => p.key === k).map(p => p.id));
      S.tab = "payments";
      break; }
    case "verdict": S.verdict[d.f] = d.v; break;
    case "hint":
      if (!canSpend(60)) return;
      spend(60); S.hints++; S.chat.push({time:clock(S.used), t:nextHint()});
      break;
    case "doc": S.doc = d.id; S.modal = "doc"; break;
    case "rules": S.modal = "rules"; break;
    case "openFix": S.fixErr = null; S.modal = "fix"; break;
    case "applyFix": {
      const r = document.querySelector('input[name="fix"]:checked');
      if (!r){ S.fixErr = "none"; break; }
      if (!canSpend(60)){ S.fixErr = "time"; break; }
      const n = document.getElementById("norm");
      spend(60); S.fix = r.value; S.norm = !!(n && n.checked);
      S.modal = null; S.result = {tool:"fixed"}; S.tab = "merged"; S.hl = new Set();
      break; }
    case "close": case "overlay": S.modal = null; S.doc = null; break;
    case "brief": S.modal = null; S.screen = "brief"; window.scrollTo(0,0); break;
    case "memo": S.memo[+d.s] = +d.i; break;
    case "submit": S.screen = "end"; window.scrollTo(0,0); break;
    case "restart": S = fresh(); window.scrollTo(0,0); break;
  }
  if (S.screen === "work" && S.used >= BUDGET && !S.modal) S.modal = "timeout";
  render();
}

document.addEventListener("click", e => {
  const el = e.target.closest("[data-act]");
  if (!el || el.disabled) return;
  if (el.dataset.act === "overlay" && e.target !== el) return;
  act(el.dataset.act, el.dataset);
});
document.addEventListener("keydown", e => {
  if (e.key === "Escape" && S.modal && S.modal !== "timeout"){ act("close", {}); return; }
  const el = e.target.closest && e.target.closest("tr[data-act]");
  if (el && (e.key === "Enter" || e.key === " ")){ e.preventDefault(); act(el.dataset.act, el.dataset); }
});

render();
</script>
</body>
</html>
